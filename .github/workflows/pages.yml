name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # the page links ../tex/a000104.pdf (right in a checkout); on the site
      # the PDF sits at tex/a000104.pdf next to index.html
      - run: |
          mkdir -p _site/tex
          cp -R html/. _site/
          cp tex/a000104.pdf _site/tex/
          sed -i 's#\.\./tex/a000104\.pdf#tex/a000104.pdf#g' _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
